# Builds without needing a local Mac:
# - ios: compiles the app on a GitHub-hosted macOS runner and uploads an UNSIGNED .ipa.
#   Sign + install it on your iPhone from Windows with a sideloading tool (see ios/README.md).
# - firmware: compiles the ESP32 PlatformIO project.
name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The app's own GIPHY key, so customers never handle one. Stored as the repository secret
      # GIPHY_API_KEY, written into Info.plist on the runner only (never committed). Without the secret
      # (forks, pull requests from forks) the key stays empty and GIF search says it isn't set up.
      - name: Embed GIPHY key
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          if [ -n "$GIPHY_API_KEY" ]; then
            plutil -replace GiphyAPIKey -string "$GIPHY_API_KEY" SpotifyDisplay.swiftpm/Sources/SpotifyDisplay/Resources/Info.plist
            echo "GIPHY key embedded"
          else
            echo "No GIPHY_API_KEY secret: GIF search will be off in this build"
          fi

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project ios/SpotifyDisplay.xcodeproj \
            -scheme SpotifyDisplay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpotifyDisplay.app Payload/
          zip -qry SpotifyDisplay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyDisplay-unsigned-ipa
          path: SpotifyDisplay-unsigned.ipa
          retention-days: 14

      # After the upload, so a test failure still leaves the IPA to download.
      - name: Unit tests (iOS simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project ios/SpotifyDisplay.xcodeproj \
            -scheme SpotifyDisplay \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile firmware
        run: pio run -e esp32-s3-devkitc-1
