# Builds without needing a local Mac:
# - ios: compiles the app on a GitHub-hosted macOS runner and uploads an UNSIGNED .ipa.
#   Sign + install it on your iPhone from Windows with a sideloading tool (see ios/README.md).
# - firmware: compiles the ESP32 PlatformIO project.
name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # gen_xcodeproj.py is deterministic: if regenerating changes the committed project, a Swift
      # file was added/renamed without re-running it and this build would silently miss that file.
      - name: Check Xcode project is up to date
        run: |
          python3 ios/gen_xcodeproj.py
          git diff --exit-code -- ios/SpotifyDisplay.xcodeproj || {
            echo "::error::ios/SpotifyDisplay.xcodeproj is stale. Run: python ios/gen_xcodeproj.py and commit."
            exit 1
          }

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project ios/SpotifyDisplay.xcodeproj \
            -scheme SpotifyDisplay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpotifyDisplay.app Payload/
          zip -qry SpotifyDisplay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyDisplay-unsigned-ipa
          path: SpotifyDisplay-unsigned.ipa
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile firmware
        run: pio run -e esp32-s3-devkitc-1
