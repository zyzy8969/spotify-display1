; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Pinned: espressif32 6.12+ ships Arduino-ESP32 core 3.x, which removed
; ledcSetup()/ledcAttachPin() used by the backlight code. 6.5.0 = core 2.0.14.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
; Default: Windows COM3 (change to your port). macOS/Linux: `pio device list` then e.g. upload_port = /dev/cu.usbserial-*
upload_port = COM6
monitor_port = COM6
monitor_speed = 921600
; 921600 flashes ~1 MB in seconds (57600 took minutes). If uploads fail on a long/cheap
; cable, step down to 460800.
upload_speed = 921600
lib_deps = moononournation/GFX Library for Arduino@1.4.9

; Match Arduino IDE settings
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_SUPPORT=1
    -mfix-esp32-psram-cache-issue
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CONFIG_BTDM_CTRL_MODE_BTDM=0
    -D CONFIG_BTDM_CTRL_MODE_BLE_ONLY=1
